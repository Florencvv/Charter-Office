<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script>
fetch("charter-office.html").then(function(r){return r.text()}).then(function(t){
  var f = document.createElement("iframe");
  f.style.width="1400px"; f.style.height="900px";
  document.body.appendChild(f);
  f.onload = function(){
    var w = f.contentWindow, d = f.contentDocument;
    var lines = [];
    try {
      var c1 = w.deriveCard("beans"), c2 = w.deriveCard("beans");
      lines.push("deterministic: " + (JSON.stringify(c1.g) === JSON.stringify(c2.g) && c1.charter === c2.charter));
      lines.push("charter digits: " + c1.charter.length + " value " + c1.charter);
      lines.push("serial roundtrip: " + (w.decodeSerial(c1.serial) === "beans"));
      lines.push("quiz questions: " + w.QUIZ.questions.length);
      lines.push("quiz options per q: " + w.QUIZ.questions.map(function(q){return q.options.length}).join(","));
      lines.push("keys per q: " + w.QUIZ.questions.map(function(q){return q.options.filter(function(o){return o.key}).length}).join(","));
      lines.push("ranks: " + Object.keys(w.QUIZ.ranks).join(" "));
      lines.push("profileRank: " + JSON.stringify(w.QUIZ.profileRank));
      var cv = d.getElementById("card");
      lines.push("canvas backing: " + cv.width + "x" + cv.height);
      lines.push("canvas css: " + cv.style.width + " " + cv.style.height);
      lines.push("plate ms: " + w.lastPlateMs);
      var stamps = Object.keys(w.STAMPS);
      lines.push("stamps: " + stamps.join(" "));
      stamps.forEach(function(sid){
        ["wide","square"].forEach(function(m){
          var L = w.LAYOUT[m];
          var t = d.createElement("canvas"); t.width = L.W; t.height = L.H;
          try { w.drawPlate(t.getContext("2d"), c1, m, sid, 1); }
          catch(e){ lines.push("STAMP FAIL " + sid + " " + m + ": " + e.message); }
        });
      });
      ["wide","square"].forEach(function(m){
        var L = w.LAYOUT[m];
        var t = d.createElement("canvas"); t.width = L.W; t.height = L.H;
        w.drawPlate(t.getContext("2d"), c1, m, null, 1);
        var u = t.toDataURL("image/png");
        lines.push("export " + m + " " + L.W + "x" + L.H + " dataurl " + u.slice(0,22) + " bytes " + Math.round(u.length*0.75/1024) + "KB");
      });
      lines.push("bad stamp id constructor: " + (function(){ try { var t=d.createElement("canvas"); t.width=1200;t.height=675; w.drawPlate(t.getContext("2d"), c1, "wide", "constructor", 1); return "handled"; } catch(e){ return "THREW " + e.message; } })());
    } catch (e) { lines.push("ERROR " + e.message + " | " + (e.stack||"").split("\n")[1]); }
    document.getElementById("out").textContent = lines.join("\n");
  };
  f.src = "charter-office.html?n=beans";
});
</script></body></html>
