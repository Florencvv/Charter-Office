<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>plate</title>
<style>html,body{margin:0;background:#1C1712}canvas{display:block}</style></head>
<body><canvas id="card"></canvas>
<script src="quiz.js"></script><script src="engine.js"></script>
<script>
var q = new URLSearchParams(location.search);
var card = deriveCard(q.get("n") || "beans");
var mode = q.get("m") || "wide";
var sc = parseFloat(q.get("s") || "1");
var L = LAYOUT[mode];
var cv = document.getElementById("card");
cv.width = L.W * sc; cv.height = L.H * sc;
cv.style.width = (L.W * sc) + "px"; cv.style.height = (L.H * sc) + "px";
drawPlate(cv.getContext("2d"), card, mode, q.get("e") || null, sc);
</script></body></html>
