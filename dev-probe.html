<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script src="engine.js"></script>
<script>
var lines = [];
lines.push("LAYOUT.wide.counterR = " + LAYOUT.wide.counterR);
lines.push("LAYOUT.wide.crossCx = " + LAYOUT.wide.crossCx);
lines.push("drawCorner = " + typeof drawCorner);
lines.push("drawSignature = " + typeof drawSignature);
var card = deriveCard("beans");
var cv = document.createElement("canvas");
cv.width = 1200; cv.height = 675;
try { drawPlate(cv.getContext("2d"), card, "wide", null, 1); lines.push("drawPlate OK"); }
catch (e) { lines.push("THROW: " + e.name + " " + e.message); lines.push((e.stack||"").split("\n").slice(0,4).join(" | ")); }
document.getElementById("out").textContent = lines.join("\n");
</script></body></html>
